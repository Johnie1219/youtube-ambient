<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가을 계곡 앰비언트 → 유튜브 MP4 메이커</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>🍂 가을 계곡 앰비언트 <span>→ 유튜브 MP4</span></h1>
      <p class="sub">코드로 잔잔한 앰비언트 음악을 생성하고, 영상과 합쳐 고화질 MP4를 만듭니다.</p>
    </header>

    <!-- 1단계: 음악 생성 -->
    <section class="card">
      <h2><span class="step">1</span> 음악 생성</h2>

      <div class="grid">
        <label class="field">
          <span>분위기 프리셋</span>
          <select id="preset"></select>
          <small id="presetDesc" class="hint"></small>
        </label>

        <label class="field">
          <span>길이 (분)</span>
          <input id="duration" type="number" min="0.2" max="20" step="0.1" value="3" />
          <small class="hint">권장 1~5분. 길수록 브라우저 메모리를 많이 씁니다.</small>
        </label>

        <label class="field">
          <span>시드 (seed)</span>
          <div class="seed-row">
            <input id="seed" type="number" min="0" step="1" value="2025" />
            <button id="randomSeed" type="button" class="ghost" title="무작위 시드">🎲</button>
          </div>
          <small class="hint">같은 시드 = 같은 멜로디·코드 (물·바람 질감은 미세하게 달라짐)</small>
        </label>

        <label class="field">
          <span>템포 (BPM)</span>
          <input id="bpm" type="number" min="40" max="90" step="1" value="60" />
        </label>

        <label class="field">
          <span>리버브 (공간감): <b id="reverbVal">50</b>%</span>
          <input id="reverb" type="range" min="0" max="90" step="1" value="50" />
        </label>
      </div>

      <div class="layers">
        <span class="layers-label">레이어</span>
        <label><input type="checkbox" id="layer-pad" checked /> 패드</label>
        <label><input type="checkbox" id="layer-melody" checked /> 멜로디</label>
        <label><input type="checkbox" id="layer-sub" checked /> 베이스</label>
        <label><input type="checkbox" id="layer-water" checked /> 물·바람 질감</label>
      </div>

      <div class="actions">
        <button id="generate" class="primary">🎵 음악 생성</button>
        <span id="genStatus" class="status"></span>
      </div>

      <div id="audioResult" class="result hidden">
        <audio id="player" controls></audio>
        <button id="downloadWav" class="ghost">⬇ WAV 다운로드</button>
      </div>
    </section>

    <!-- 2단계: 영상 합치기 -->
    <section class="card">
      <h2><span class="step">2</span> 영상과 합쳐 MP4 만들기</h2>

      <div class="grid">
        <label class="field full">
          <span>배경 (선택) — 영상 또는 이미지 파일</span>
          <input id="media" type="file" accept="video/*,image/*" />
          <small class="hint">
            영상은 음악 길이에 맞춰 자동 루프, 이미지는 천천히 줌(켄번스).
            비우면 가을톤 그라데이션이 자동 생성됩니다.
          </small>
        </label>

        <label class="field">
          <span>해상도</span>
          <select id="resolution">
            <option value="1080p">1080p (1920×1080)</option>
            <option value="4k">4K (3840×2160)</option>
          </select>
        </label>

        <label class="field">
          <span>프레임레이트</span>
          <select id="fps">
            <option value="30">30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="render" class="primary" disabled>🎬 MP4 만들기</button>
        <span id="renderStatus" class="status"></span>
      </div>

      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress"><div id="progressBar" class="bar"></div></div>
        <span id="progressPct">0%</span>
      </div>

      <div id="mp4Result" class="result hidden">
        <video id="mp4Preview" controls></video>
        <a id="downloadMp4" class="primary" download>⬇ MP4 다운로드</a>
      </div>
    </section>

    <footer class="foot">
      <span>로컬에서 동작 · 음악은 브라우저에서 생성 · 합치기는 번들된 ffmpeg 사용</span>
    </footer>
  </div>

  <!-- Tone.js (로컬 서빙, 오프라인 동작) -->
  <script src="/vendor/Tone.js"></script>
  <script src="audio/wav-encoder.js"></script>
  <script src="audio/ambient-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
