plugins {
  id 'com.android.application'
}

android {
  namespace 'com.aimusic.studio'
  compileSdk 34

  defaultConfig {
    applicationId "com.aimusic.studio"
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName "1.0"
  }

  // 고정 서명 키(저장소에 포함) — 빌드 머신이 바뀌어도 서명이 항상 같아
  // 기존 설치 위에 업데이트로 덮어쓸 수 있다("앱이 설치되지 않음" 방지).
  signingConfigs {
    fixedDebug {
      storeFile file("../keystore/debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.fixedDebug
    }
    release {
      minifyEnabled false
      signingConfig signingConfigs.fixedDebug
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
