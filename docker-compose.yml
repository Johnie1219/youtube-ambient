services:
  ambient:
    build: .
    # 또는 미리 빌드한 이미지를 쓰려면 위 build 대신:
    # image: youtube-ambient:latest
    container_name: youtube-ambient
    restart: unless-stopped
    ports:
      - "5174:5174"        # 호스트:컨테이너 — NAS에서 원하는 호스트 포트로 바꿔도 됨
    environment:
      - PORT=5174
      - HOST=0.0.0.0
      - OUTPUT_DIR=/data/output     # 완성 영상이 여기에 영구 저장됨(아래 볼륨에 매핑)
      # 외부 노출 시 권장: 간단 인증 (원하면 주석 해제하고 값 변경)
      # - BASIC_AUTH_USER=admin
      # - BASIC_AUTH_PASS=바꾸세요_강력한_비밀번호
      # ── 유튜브 자동 업로드 (나중에 계정/자격증명 받으면 채우기) ──
      # - YT_CLIENT_ID=...apps.googleusercontent.com
      # - YT_CLIENT_SECRET=...
      # - YT_REFRESH_TOKEN=...
    volumes:
      # 완성 영상을 NAS에 영구 저장(도커 named volume — 폴더를 미리 만들 필요 없음).
      - ambient_output:/data/output

volumes:
  ambient_output:
