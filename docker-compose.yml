services:
  ambient:
    # 깃에 올라간 코드를 GitHub가 자동 빌드해 올린 이미지를 받아서 실행한다.
    # (NAS에서 직접 빌드하지 않으므로 느린 빌드가 없음)
    image: ghcr.io/johnie1219/youtube-ambient:latest
    pull_policy: always
    # 로컬에서 소스로 직접 빌드하려면 위 image 대신 아래 주석을 사용:
    # build: .
    container_name: youtube-ambient
    restart: unless-stopped
    ports:
      - "5174:5174"        # 호스트:컨테이너 — NAS에서 원하는 호스트 포트로 바꿔도 됨
    environment:
      - PORT=5174
      - HOST=0.0.0.0
      - OUTPUT_DIR=/data/output     # 완성 영상이 여기에 영구 저장됨(아래 볼륨에 매핑)
      # 외부 노출 시 권장: 간단 인증 (원하면 주석 해제하고 값 변경)
      # - BASIC_AUTH_USER=admin
      # - BASIC_AUTH_PASS=바꾸세요_강력한_비밀번호
      # ── 유튜브 자동 업로드 (나중에 계정/자격증명 받으면 채우기) ──
      # - YT_CLIENT_ID=...apps.googleusercontent.com
      # - YT_CLIENT_SECRET=...
      # - YT_REFRESH_TOKEN=...
    volumes:
      # 완성 영상을 NAS에 영구 저장(도커 named volume — 폴더를 미리 만들 필요 없음).
      - ambient_output:/data/output

  # 깃에 새 코드가 올라가면 자동으로 위 컨테이너를 최신 이미지로 교체(2분마다 확인).
  watchtower:
    image: containrrr/watchtower
    container_name: youtube-ambient-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 120 --cleanup youtube-ambient

volumes:
  ambient_output:
