name: build-apk

# 안드로이드 APK를 빌드해서 'apk-latest' 릴리스에 올린다.
# 폰에서 Releases 페이지 → app-debug.apk 받아서 설치(사이드로드).
on:
  push:
    branches:
      - claude/laughing-newton-bojmce
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AI Music Studio (APK)
          body: |
            안드로이드 APK입니다. 폰에서 이 파일을 받아 설치하세요(출처를 알 수 없는 앱 허용 필요).
            접속 주소는 Tailscale(100.73.34.47:5174) 기준이라 폰에 Tailscale 연결이 필요합니다.
          files: android/app/build/outputs/apk/debug/app-debug.apk
